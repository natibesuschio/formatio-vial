document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

in:0 0 14px;color:var(--tinta);max-width:20ch;text-wrap:pretty\">Acompañamiento claro<\u002Fh3>\n          <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:#474C55;max-width:46ch\">Una experiencia organizada para avanzar de forma simple y entender cada etapa de la capacitación.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CÓMO FUNCIONA -->\n<section id=\"como-funciona\" style=\"padding:clamp(56px,7vw,110px) 0;background:#E4DCCD;border-top:1px solid #D6CCBA;border-bottom:1px solid #D6CCBA\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,56px)\">\n    <div data-reveal=\"\">\n      <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--ox);margin-bottom:16px\">RECORRIDO<\u002Fdiv>\n      <h2 style=\"font:600 clamp(28px,3.4vw,46px)/1.1 'Libre Franklin',sans-serif;letter-spacing:-.02em;margin:0;color:var(--tinta);max-width:20ch;text-wrap:pretty\">Tu capacitación, paso por paso.<\u002Fh2>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"margin-top:clamp(40px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(34px,4vw,52px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(34px,4vw,52px)\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;transition:transform .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"transform:translateY(-6px) scale(1.012)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:13px;height:13px;border-radius:50%;background:var(--ox);flex:none\"><\u002Fspan><span style=\"flex:1;height:1px;background:#C9C0AE\"><\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--ox)\">01<\u002Fspan>\n        <h3 style=\"font:500 clamp(18px,1.6vw,22px)/1.25 'Libre Franklin',sans-serif;margin:0;color:var(--tinta)\">Elegí tu capacitación<\u002Fh3>\n        <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:#474C55;max-width:30ch\">Renovación si ya tenés licencia profesional; Inicial si es la primera vez.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px;transition:transform .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"transform:translateY(-6px) scale(1.012)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:13px;height:13px;border-radius:50%;border:1.5px solid #8C8A85;flex:none\"><\u002Fspan><span style=\"flex:1;height:1px;background:#C9C0AE\"><\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#474C55\">02<\u002Fspan>\n        <h3 style=\"font:500 clamp(18px,1.6vw,22px)/1.25 'Libre Franklin',sans-serif;margin:0;color:var(--tinta)\">Inscribite<\u002Fh3>\n        <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:#474C55;max-width:30ch\">Completás tus datos y recibís las instrucciones de acceso.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(34px,4vw,52px)\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;transition:transform .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"transform:translateY(-6px) scale(1.012)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:13px;height:13px;border-radius:50%;border:1.5px solid #8C8A85;flex:none\"><\u002Fspan><span style=\"flex:1;height:1px;background:#C9C0AE\"><\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#474C55\">03<\u002Fspan>\n        <h3 style=\"font:500 clamp(18px,1.6vw,22px)/1.25 'Libre Franklin',sans-serif;margin:0;color:var(--tinta)\">Accedé a tus contenidos<\u002Fh3>\n        <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:#474C55;max-width:30ch\">Entrás a la plataforma y avanzás módulo por módulo, a tu ritmo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px;transition:transform .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"transform:translateY(-6px) scale(1.012)\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:13px;height:13px;border-radius:50%;border:1.5px solid #8C8A85;flex:none\"><\u002Fspan><\u002Fdiv>\n        <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#474C55\">04<\u002Fspan>\n        <h3 style=\"font:500 clamp(18px,1.6vw,22px)/1.25 'Libre Franklin',sans-serif;margin:0;color:var(--tinta)\">Completá tu capacitación<\u002Fh3>\n        <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:#474C55;max-width:30ch\">Cerrás la práctica final y obtenés tu certificado.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FORMAR CRITERIO -->\n<section id=\"criterio\" style=\"padding:clamp(64px,8vw,130px) 0;background:var(--tinta);color:#F7F4EF\">\n  <div data-reveal=\"\" style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(36px,5vw,80px);align-items:start\">\n    <div>\n      <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#C98A63;margin-bottom:18px\">RESPONSABILIDAD PROFESIONAL<\u002Fdiv>\n      <h2 style=\"font:300 clamp(30px,3.8vw,54px)/1.06 'Libre Franklin',sans-serif;letter-spacing:-.03em;margin:0;color:#F7F4EF;max-width:20ch;text-wrap:pretty\">Una licencia habilita.<br><span style=\"font-family:'Newsreader',Georgia,serif;font-weight:400;letter-spacing:-.01em\">La formación prepara para decidir.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:clamp(22px,2.6vw,32px) 0 0;font:400 clamp(16px,1.2vw,17.5px)/1.7 'Libre Franklin',sans-serif;color:rgba(247,244,239,.75);max-width:46ch\">Conducir profesionalmente implica tomar decisiones todos los días. La capacitación no se trata solamente de memorizar normas, sino de aprender a anticipar, evaluar y actuar con responsabilidad.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:baseline;padding:clamp(18px,2vw,26px) 0;border-top:1px solid rgba(247,244,239,.2);transition:padding-left .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"padding-left:12px\">\n        <span style=\"font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#C98A63\">01<\u002Fspan>\n        <div>\n          <h3 style=\"font:500 17.5px/1.3 'Libre Franklin',sans-serif;margin:0 0 8px;color:#F7F4EF\">Anticipar<\u002Fh3>\n          <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:rgba(247,244,239,.72);max-width:42ch\">Leer la situación antes de que se convierta en un problema.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:baseline;padding:clamp(18px,2vw,26px) 0;border-top:1px solid rgba(247,244,239,.2);transition:padding-left .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"padding-left:12px\">\n        <span style=\"font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(247,244,239,.5)\">02<\u002Fspan>\n        <div>\n          <h3 style=\"font:500 17.5px/1.3 'Libre Franklin',sans-serif;margin:0 0 8px;color:#F7F4EF\">Decidir<\u002Fh3>\n          <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:rgba(247,244,239,.72);max-width:42ch\">Aplicar conocimiento y experiencia en situaciones reales.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:baseline;padding:clamp(18px,2vw,26px) 0;border-top:1px solid rgba(247,244,239,.2);border-bottom:1px solid rgba(247,244,239,.2);transition:padding-left .28s cubic-bezier(.2,.7,.3,1)\" style-hover=\"padding-left:12px\">\n        <span style=\"font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(247,244,239,.5)\">03<\u002Fspan>\n        <div>\n          <h3 style=\"font:500 17.5px/1.3 'Libre Franklin',sans-serif;margin:0 0 8px;color:#F7F4EF\">Cuidar<\u002Fh3>\n          <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.7 'Libre Franklin',sans-serif;color:rgba(247,244,239,.72);max-width:42ch\">Cada decisión involucra a pasajeros y a otras personas en la vía pública.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"preguntas\" style=\"padding:clamp(56px,7vw,110px) 0\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,56px)\">\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(20px,3vw,56px);align-items:end\">\n      <div>\n        <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--ox);margin-bottom:16px\">PREGUNTAS<\u002Fdiv>\n        <h2 style=\"font:600 clamp(28px,3.4vw,46px)/1.1 'Libre Franklin',sans-serif;letter-spacing:-.02em;margin:0;color:var(--tinta);max-width:20ch;text-wrap:pretty\">Antes de empezar, resolvé tus dudas.<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font:400 clamp(16px,1.15vw,17px)/1.65 'Libre Franklin',sans-serif;color:#474C55;max-width:44ch\">Si te queda algo sin responder, escribinos por WhatsApp y te orientamos.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(36px,4.5vw,64px);border-top:1px solid #C9C0AE\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeho span style=\"font-weight:300\">VIAL<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:20px 0 0;font:400 16px/1.65 'Libre Franklin',sans-serif;color:rgba(247,244,239,.62);max-width:30ch\">Formación profesional para conductores de transporte público.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(247,244,239,.45);margin-bottom:18px\">EXPLORAR<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <a href=\"#cursos\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">Cursos<\u002Fa>\n          <a href=\"#formacion\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">Formación<\u002Fa>\n          <a href=\"#como-funciona\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">Cómo funciona<\u002Fa>\n          <a href=\"#preguntas\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">Preguntas<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(247,244,239,.45);margin-bottom:18px\">CONTACTO<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <a href=\"https://wa.me/541139644678\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">WhatsApp ↗<\u002Fa>\n          <a href=\"mailto:info@formatio.com\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">info@formatio.com<\u002Fa>\n          <span style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.62);padding:8px 0\">Constitución · CABA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(247,244,239,.45);margin-bottom:18px\">REDES<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <a href=\"#top\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">Instagram<\u002Fa>\n          <a href=\"#top\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">YouTube<\u002Fa>\n          <a href=\"#top\" style=\"font:400 15px/1.4 'Libre Franklin',sans-serif;color:rgba(247,244,239,.82);padding:8px 0\" style-hover=\"color:#C98A63\">LinkedIn<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:clamp(36px,4vw,56px);padding-top:20px;border-top:1px solid rgba(247,244,239,.16);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n      <span style=\"font:400 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(247,244,239,.5)\">© 2026 FORMATIO VIAL · BUENOS AIRES · ARGENTINA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;acentoOxido&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#A8542F&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#A8542F&quot;,&quot;#8C4A2C&quot;,&quot;#B25A2A&quot;,&quot;#474C55&quot;],&quot;section&quot;:&quot;Paleta&quot;},&quot;azulTinta&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#16233D&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#16233D&quot;,&quot;#0F1930&quot;,&quot;#2A2724&quot;,&quot;#3B2740&quot;],&quot;section&quot;:&quot;Paleta&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    open: 0,\n    menuOpen: false,\n    narrow: typeof window !== 'undefined' && window.matchMedia\n      ? window.matchMedia('(max-width: 899px)').matches\n      : false\n  };\n\n  componentDidMount() {\n    const r = document.documentElement;\n    if (this.props.acentoOxido) r.style.setProperty('--ox', this.props.acentoOxido);\n    if (this.props.azulTinta) r.style.setProperty('--tinta', this.props.azulTinta);\n\n    this._mql = window.matchMedia('(max-width: 899px)');\n    this._onMql = e => this.setState({ narrow: e.matches, menuOpen: false });\n    if (this._mql.matches !== this.state.narrow) this.setState({ narrow: this._mql.matches, menuOpen: false });\n    if (this._mql.addEventListener) this._mql.addEventListener('change', this._onMql);\n    else this._mql.addListener(this._onMql);\n\n    if (!('IntersectionObserver' in window)) return;\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    this._io = new IntersectionObserver((entries, obs) => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        e.target.style.opacity = '1';\n        e.target.style.transform = 'none';\n        obs.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n    els.forEach(el => {\n      const r2 = el.getBoundingClientRect();\n      if (r2.top < window.innerHeight * 0.95) return;\n      el.style.transition = 'opacity .7s ease, transform .7s ease';\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(14px)';\n      this._io.observe(el);\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._mql) {\n      if (this._mql.removeEventListener) this._mql.removeEventListener('change', this._onMql);\n      else this._mql.removeListener(this._onMql);\n    }\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() {\n    const data = [\n      ['01', '¿Cómo sé si me corresponde Inicial o Renovación?', 'Si ya tenés licencia profesional y necesitás mantenerla vigente, te corresponde Renovación. Si la estás obteniendo por primera vez, te corresponde Inicial. Si tu situación no es clara, escribinos y lo revisamos con tu caso.'],\n      ['02', '¿Puedo cursar mientras sigo trabajando?', 'Sí. La cursada es online y avanzás módulo por módulo a tu ritmo: retomás donde lo dejaste, sin horarios fijos, desde celular, tablet o computadora.'],\n      ['03', '¿La capacitación es online o presencial?', 'Hoy toda la formación es online. El centro de Guanahani 420, en Constitución, va a sumar instancias presenciales; te avisamos antes de su apertura.'],\n      ['04', '¿Cómo se evalúa la capacitación?', 'Cada módulo incluye ejercicios de práctica y al final hay una instancia de evaluación. No se trata de memorizar normas, sino de resolver situaciones reales de la actividad.'],\n      ['05', '¿Recibo un certificado al terminar?', 'Sí. Al completar la capacitación obtenés el certificado de la formación realizada.'],\n      ['06', '¿Qué pasa si me trabo o tengo una duda durante el curso?', 'Tenés acompañamiento durante toda la cursada. Nos escribís por WhatsApp y te respondemos con la parte del material que corresponde a tu duda.']\n    ];\n    const faqs = data.map((d, i) => ({\n      n: d[0], q: d[1], a: d[2],\n      open: this.state.open === i,\n      sign: this.state.open === i ? '–' : '+',\n      toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i }))\n    }));\n    return {\n      faqs,\n      narrow: this.state.narrow,\n      wide: !this.state.narrow,\n      menuOpen: this.state.narrow && this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
